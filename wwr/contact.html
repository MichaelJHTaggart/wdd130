<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Family Fun Adventures on a river">
    <meta name="keywords" content="Rafting, Family, River, Whitewater, Fun, Adventure">
    <meta name="author" content="Michael J.H. Taggart">
    <title>Contact Us - Rapids Adventure</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="./images/z-crossedoars.jpeg" alt="Rapids Adventure Logo has a raft splashing in the water"
            width="150">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main class="contact-main">
        <section class="contact-header">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact-container">
            <div class="map-section">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5221.787260131932!2d-104.7647074099934!3d38.90356594073141!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1759621574334!5m2!1sen!2sus"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form-section">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset class="form-group">
                    <legend>Message Purpose</legend>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="website">
                            Website Suggestion
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" name="newsletter" value="yes">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <div class="form-group">
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure class="employee">
                    <img src="images/facebook.svg" alt="Sarah Johnson" width="200" height="200">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure class="employee">
                    <img src="images/facebook.svg" alt="Mike Rivera" width="200" height="200">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure class="employee">
                    <img src="images/facebook.svg" alt="Emily Chen" width="200" height="200">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Rapids Adventure. All rights reserved.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" width="40" height="40" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" width="40" height="40" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" width="40" height="40" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
